
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Population Choropleth</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }

        h2 {
            text-align: center;
            color: #222;
        }

        svg {
            display: block;
            margin: auto;
            background-color: #eaf4fc;
            border: 1px solid #ccc;
        }

        .country {
            stroke: white;
            stroke-width: 0.6px;
        }

        .country:hover {
            stroke: #111;
            stroke-width: 1.5px;
        }

        .tooltip {
            position: absolute;
            background: white;
            color: #111;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 10px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .legend-label {
            font-size: 12px;
            fill: #222;
        }
    </style>
</head>

<body>

    <h2>World Population by Country</h2>

    <svg width="1100" height="650"></svg>

    <div class="tooltip"></div>

    <script>
        const width = 1100;
        const height = 650;

        const svg = d3.select("svg");
        const tooltip = d3.select(".tooltip");

        Promise.all([
            d3.csv("population.csv", d3.autoType),
            d3.json("world.geojson")
        ]).then(function([populationData, worldData]) {

            // Match population data using ISO-3 country codes
            const populationMap = new Map(
                populationData.map(d => [
                    d.id,
                    {
                        country: d.country,
                        population: d.population_millions
                    }
                ])
            );

            // Projection and path generator
            const projection = d3.geoNaturalEarth1()
                .fitExtent(
                    [[20, 20], [width - 20, height - 100]],
                    worldData
                );

            const path = d3.geoPath()
                .projection(projection);

            // Sequential square-root color scale
            const maxPopulation = d3.max(
                populationData,
                d => d.population_millions
            );

            const color = d3.scaleSequential()
                .domain([0, Math.sqrt(maxPopulation)])
                .interpolator(d3.interpolateYlOrRd);

            // Draw countries
            svg.append("g")
                .selectAll("path")
                .data(worldData.features)
                .join("path")
                .attr("class", "country")
                .attr("d", path)
                .attr("fill", function(d) {

                    const code =
                        d.properties["ISO3166-1-Alpha-3"];

                    const countryData = populationMap.get(code);

                    if (!countryData ||
                        countryData.population == null) {
                        return "#d3d3d3";
                    }

                    return color(
                        Math.sqrt(countryData.population)
                    );
                })
                .on("mouseenter", function(event, d) {

                    const code =
                        d.properties["ISO3166-1-Alpha-3"];

                    const countryData = populationMap.get(code);

                    const mapCountryName =
                        d.properties.name || "Unknown country";

                    if (countryData) {
                        tooltip.html(
                            "<strong>" + countryData.country +
                            "</strong><br>Population: " +
                            countryData.population +
                            " million"
                        );
                    } else {
                        tooltip.html(
                            "<strong>" + mapCountryName +
                            "</strong><br>Population: No data available"
                        );
                    }

                    tooltip.style("opacity", 1);
                })
                .on("mousemove", function(event) {
                    tooltip
                        .style("left", (event.pageX + 12) + "px")
                        .style("top", (event.pageY + 12) + "px");
                })
                .on("mouseleave", function() {
                    tooltip.style("opacity", 0);
                });

            // Legend title
            svg.append("text")
                .attr("x", 30)
                .attr("y", height - 55)
                .attr("font-size", 13)
                .attr("font-weight", "bold")
                .text("Population (millions)");

            // Legend scale
            const legendValues = [0, 100, 300, 600, 1000, 1500];

            const legendScale = d3.scaleLinear()
                .domain([0, 1500])
                .range([30, 330]);

            const legend = svg.append("g")
                .attr("transform", `translate(0,${height - 40})`);

            legend.selectAll("rect")
                .data(d3.range(0, 1500, 25))
                .join("rect")
                .attr("x", d => legendScale(d))
                .attr("y", 0)
                .attr("width", 6)
                .attr("height", 12)
                .attr("fill", d => color(Math.sqrt(d)));

            legend.selectAll("text")
                .data(legendValues)
                .join("text")
                .attr("class", "legend-label")
                .attr("x", d => legendScale(d))
                .attr("y", 28)
                .text(d => d);

        }).catch(function(error) {
            console.error("Error loading files:", error);

            alert(
                "Could not load population.csv or world.geojson. " +
                "Make sure both files are in the same folder and " +
                "run this page using VS Code Live Server."
            );
        });
    </script>

</body>
</html>
